<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shubham Reddy | 3D AI Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 3D WORLD -->
    <div id="app"></div>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen">
        <div class="loader-core"></div>
        <h1>SHUBHAM'S AI WORLD</h1>
        <p id="loadingText">Initializing 3D environment...</p>

        <div class="loading-bar">
            <div id="loadingProgress"></div>
        </div>
    </div>

    <!-- TOP UI -->
    <div id="topUI">

        <div class="brand">
            <span>&lt;/&gt;</span> SHUBHAM
        </div>

        <div class="status">
            <span class="status-dot"></span>
            AI WORLD ONLINE
        </div>

    </div>

    <!-- INFORMATION PANEL -->
    <div id="infoPanel">

        <button id="closePanel">×</button>

        <div id="panelIcon">◆</div>

        <h2 id="panelTitle">Welcome</h2>

        <p id="panelDescription">
            Explore Shubham's AI portfolio.
        </p>

        <button id="panelAction">
            EXPLORE
        </button>

    </div>

    <!-- CONTROLS -->
    <div id="controls">

        <div class="control-row">
            <button id="up">▲</button>
        </div>

        <div class="control-row">
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>

    </div>

    <!-- HELP -->
    <div id="helpText">
        <b>WASD / ARROWS</b> Move &nbsp; • &nbsp;
        <b>CLICK</b> Interact
    </div>

    <!-- THREE.JS -->
    <script type="module" src="main.js"></script>

</body>
</html>
